<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, Helvetica, sans-serif" font-size="16">
  <rect width="720" height="460" fill="#ffffff"/>
  <!-- grade: 1 linha por segundo e por m/s -->
  <g stroke="#e3e7ee">
    <line x1="130.8" y1="30" x2="130.8" y2="390"/><line x1="181.7" y1="30" x2="181.7" y2="390"/>
    <line x1="232.5" y1="30" x2="232.5" y2="390"/><line x1="283.3" y1="30" x2="283.3" y2="390"/>
    <line x1="334.2" y1="30" x2="334.2" y2="390"/><line x1="385" y1="30" x2="385" y2="390"/>
    <line x1="435.8" y1="30" x2="435.8" y2="390"/><line x1="486.7" y1="30" x2="486.7" y2="390"/>
    <line x1="537.5" y1="30" x2="537.5" y2="390"/><line x1="588.3" y1="30" x2="588.3" y2="390"/>
    <line x1="639.2" y1="30" x2="639.2" y2="390"/><line x1="690" y1="30" x2="690" y2="390"/>
    <line x1="80" y1="330" x2="690" y2="330"/><line x1="80" y1="270" x2="690" y2="270"/>
    <line x1="80" y1="210" x2="690" y2="210"/><line x1="80" y1="150" x2="690" y2="150"/>
    <line x1="80" y1="90" x2="690" y2="90"/><line x1="80" y1="30" x2="690" y2="30"/>
  </g>
  <!-- eixos -->
  <line x1="80" y1="390" x2="690" y2="390" stroke="#222" stroke-width="2"/>
  <line x1="80" y1="30" x2="80" y2="390" stroke="#222" stroke-width="2"/>
  <!-- rótulos do eixo vertical -->
  <g fill="#222" text-anchor="end">
    <text x="68" y="395">0</text><text x="68" y="335">1</text><text x="68" y="275">2</text>
    <text x="68" y="215">3</text><text x="68" y="155">4</text><text x="68" y="95">5</text>
    <text x="68" y="35">6</text>
  </g>
  <!-- rótulos do eixo horizontal -->
  <g fill="#222" text-anchor="middle">
    <text x="80" y="416">0</text><text x="232.5" y="416">3</text><text x="385" y="416">6</text>
    <text x="537.5" y="416">9</text><text x="690" y="416">12</text>
  </g>
  <text x="385" y="446" text-anchor="middle" fill="#222">Tempo (s)</text>
  <text transform="translate(24 210) rotate(-90)" text-anchor="middle" fill="#222">Velocidade (m/s)</text>
  <!-- curva v × t: (0;0) (3;3) (6;6) (9;6) (12;6) -->
  <polyline fill="none" stroke="#143f8a" stroke-width="3.5" stroke-linejoin="round"
            points="80,390 232.5,210 385,30 537.5,30 690,30"/>
  <g fill="#143f8a">
    <circle cx="80" cy="390" r="6"/><circle cx="232.5" cy="210" r="6"/><circle cx="385" cy="30" r="6"/>
    <circle cx="537.5" cy="30" r="6"/><circle cx="690" cy="30" r="6"/>
  </g>
</svg>
